<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laundry Flow Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Dokumentasi Alur Laundry">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    #sidebar-toggle {
      background: #42b983;
      border: 0;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      height: 38px;
      left: 315px;
      line-height: 1;
      padding: 0;
      position: fixed;
      top: 15px;
      transition: left 0.25s ease, background 0.2s ease;
      width: 38px;
      z-index: 30;
    }

    #sidebar-toggle:hover {
      background: #369b6f;
    }

    body.sidebar-collapsed .sidebar {
      transform: translateX(-100%);
    }

    body.sidebar-collapsed .content {
      left: 0;
    }

    body.sidebar-collapsed #sidebar-toggle {
      left: 15px;
    }

    @media screen and (max-width: 800px) {
      #sidebar-toggle {
        left: 15px;
      }

      body:not(.sidebar-collapsed) .sidebar {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>
  <div id="app">Please wait...</div>
  
  <script>
    window.$docsify = {
      name: 'Laundry Flow',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              var mermaidCode = code.replace(
                /(\r?\n\s*class\s+)/m,
                '\nclassDef danger fill:#991b1b,color:#fff,stroke:#ef4444,stroke-width:2px;\n$1'
              );
              return '<div class="mermaid">' + mermaidCode + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook, vm) {
          hook.ready(function() {
            var toggle = document.createElement('button');
            toggle.id = 'sidebar-toggle';
            toggle.type = 'button';
            toggle.setAttribute('aria-label', 'Tutup sidebar');
            toggle.setAttribute('aria-expanded', 'true');
            toggle.textContent = String.fromCharCode(9776);

            toggle.addEventListener('click', function() {
              var isCollapsed = document.body.classList.toggle('sidebar-collapsed');
              toggle.setAttribute('aria-label', isCollapsed ? 'Buka sidebar' : 'Tutup sidebar');
              toggle.setAttribute('aria-expanded', String(!isCollapsed));
              toggle.textContent = isCollapsed ? String.fromCharCode(9776) : String.fromCharCode(215);
            });

            document.body.appendChild(toggle);
          });

          hook.doneEach(function() {
            if (window.mermaid) {
              window.mermaid.init(undefined, document.querySelectorAll('.mermaid'));
            }
          });
        }
      ]
    }
  </script>
  
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Mermaid Support -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@9/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: 'dark',
      flowchart: {
        curve: 'linear',
        nodeSpacing: 60,
        rankSpacing: 80,
        diagramPadding: 24
      }
    });
  </script>
</body>
</html>
